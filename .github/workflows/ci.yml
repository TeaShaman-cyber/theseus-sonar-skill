name: dev check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dev-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run canonical repository check
        run: tools/dev/check
